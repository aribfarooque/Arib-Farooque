const PER=30,N=Math.ceil(D.length/PER),L='ABCD';
const $=document.getElementById('app');
let sel=new Set(),T=null,filt='all',navOpen=false;
let hist={};try{hist=JSON.parse(localStorage.getItem('physHist')||'{}')}catch(e){}
function sv(){try{localStorage.setItem('physHist',JSON.stringify(hist))}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const rng=i=>[i*PER+1,Math.min(D.length,(i+1)*PER)];
function home(){
  T=null;scrollTo(0,0);
  let h='<div class="hero"><h1>🩺 Physiological CBT Practice</h1><p>Pick any tests, start, and get instant answers. Everything reshuffles every time.</p><div class="pills"><span>'+D.length+' questions</span><span>'+N+' tests × '+PER+'</span><span>Instant feedback</span></div></div>';
  h+='<h2>🎯 Full syllabus test</h2><div class="card full"><div><b>All '+D.length+' questions in one test</b><div class="mu">Every question from the PDF, shuffled, with shuffled options.'+(hist.full!=null?' Last score: '+hist.full+'%':'')+'</div></div><button class="b" id="fs">Start full test</button></div>';
  h+='<h2>📚 Select tests</h2><div class="mu">Tap one or more tests (e.g. 2 + 6, or 4, 6, 7, 15, 18, 20), then press Start.</div><div class="tools"><button class="chip" id="all">Select all</button><button class="chip" id="clr">Clear</button></div><div class="grid">';
  for(let i=0;i<N;i++){const[s,e]=rng(i);h+='<button class="t'+(sel.has(i)?' on':'')+'" data-i="'+i+'"><b>Test '+(i+1)+'</b><span>Q '+s+'–'+e+'</span>'+(hist[i]!=null?'<em>Last '+hist[i]+'%</em>':'')+'</button>'}
  h+='</div><div class="bar"><div><span id="sc"></span><button class="b" id="go">Start selected →</button></div></div>';
  $.innerHTML=h;upd();
  $.querySelectorAll('.t').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('on');upd()});
  document.getElementById('all').onclick=()=>{for(let i=0;i<N;i++)sel.add(i);home()};
  document.getElementById('clr').onclick=()=>{sel.clear();home()};
  document.getElementById('go').onclick=()=>start([...sel].sort((a,b)=>a-b));
  document.getElementById('fs').onclick=()=>start(null);
}
function upd(){
  const k=sel.size,q=[...sel].reduce((a,i)=>a+rng(i)[1]-rng(i)[0]+1,0);
  document.getElementById('sc').innerHTML=k?'<b>'+k+'</b> test'+(k>1?'s':'')+' · <b>'+q+'</b> questions':'<span class="mu">No test selected</span>';
  document.getElementById('go').disabled=!k;
}
function start(tests){
  let pool;
  if(tests)pool=D.filter((_,i)=>tests.includes(Math.floor(i/PER)));else pool=D;
  const qs=shuf(pool).map(r=>({no:r[0],q:r[1],opts:shuf([{t:r[2],c:1},{t:r[3],c:0},{t:r[4],c:0},{t:r[5],c:0}]),ans:null}));
  T={tests,qs,k:0,done:false};filt='all';navOpen=false;scrollTo(0,0);render();
}
const title=()=>T.tests?(T.tests.length==1?'Test '+(T.tests[0]+1):'Tests '+T.tests.map(x=>x+1).join(', ')):'Full syllabus';
function render(){

  const q=T.qs[T.k],n=T.qs.length,ans=T.qs.filter(x=>x.ans!=null).length;
  let h='<div class="top"><b>'+title()+'</b><span class="mu">Answered '+ans+' / '+n+'</span></div><div class="prog"><i style="width:'+(ans/n*100)+'%"></i></div>';
  h+='<div class="card"><div class="top"><span class="mu">Question '+(T.k+1)+' of '+n+'</span><span class="badge">PDF Q.'+q.no+'</span></div><div class="qt">'+esc(q.q)+'</div>';
  q.opts.forEach((o,j)=>{let c='o';if(q.ans!=null){c+=' lock';if(o.c)c+=' ok';else if(q.ans===j)c+=' no'}
    h+='<button class="'+c+'" data-j="'+j+'"><i>'+L[j]+'</i><span>'+esc(o.t)+(q.ans!=null&&o.c?' ✓':q.ans===j?' ✗':'')+'</span></button>'});

function pick(j){const q=T.qs[T.k];if(q.ans!=null)return;q.ans=j;render()}
function go(d){T.k+=d;scrollTo(0,0);render()}
document.addEventListener('keydown',e=>{
  if(!T||T.done||modal)return;const k=e.key.toLowerCase(),i=L.toLowerCase().indexOf(k);

let modal=false;
function ask(msg,yes,cb){
  modal=true;const m=document.createElement('div');m.className='mk';
  m.innerHTML='<div class="md"><p>'+esc(msg)+'</p><div><button class="b g" id="mn">Cancel</button><button class="b" id="my">'+yes+'</button></div></div>';
  document.body.appendChild(m);
  const close=()=>{modal=false;m.remove()};
  m.querySelector('#mn').onclick=close;
  m.querySelector('#my').onclick=()=>{close();cb()};
  m.onclick=e=>{if(e.target===m)close()};
}
function finish(){T.done=true;scrollTo(0,0);render()}
function submit(){
  const u=T.qs.filter(x=>x.ans==null).length;

}
function results(){
  const n=T.qs.length;let c=0,w=0,u=0;

  if(T.tests&&T.tests.length==1)hist[T.tests[0]]=p;else if(!T.tests)hist.full=p;sv();

  h+='<div class="stats"><div><b style="color:var(--ok)">'+c+'</b>Correct</div><div><b style="color:var(--no)">'+w+'</b>Wrong</div><div><b>'+u+'</b>Skipped</div><div><b>'+n+'</b>Total</div></div></div>';
  h+='<div class="row"><button class="b" id="rt">Retake (reshuffled)</button><button class="b g" id="hm">Home</button></div>';
  h+='<h2>Review answers</h2><div class="tabs">'+[['all','All'],['wrong','Wrong ('+w+')'],['right','Correct ('+c+')'],['skip','Skipped ('+u+')']].map(f=>'<button class="chip'+(filt==f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('')+'</div>';
  T.qs.forEach((x,j)=>{
    const s=x.ans==null?'u':x.opts[x.ans].c?'y':'n';
    if(filt=='wrong'&&s!='n'||filt=='right'&&s!='y'||filt=='skip'&&s!='u')return;
    h+='<div class="card rv"><span class="tag '+s+'">'+(j+1)+'. '+(s=='y'?'Correct':s=='n'?'Wrong':'Not answered')+'</span> <span class="badge">PDF Q.'+x.no+'</span><div class="qt" style="font-size:16px">'+esc(x.q)+'</div>';
    x.opts.forEach((o,k)=>h+='<div class="o'+(o.c?' ok':x.ans===k?' no':'')+'"><i>'+L[k]+'</i><span>'+esc(o.t)+(o.c?' ✓':x.ans===k?' ✗ (your answer)':'')+'</span></div>');
    h+='</div>'});
  $.innerHTML=h;
  document.getElementById('rt').onclick=()=>start(T.tests);
  document.getElementById('hm').onclick=home;
  $.querySelectorAll('.tabs .chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;results()});
}
home();
</script></body></html>
